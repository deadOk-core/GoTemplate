apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: tripgo-lab-01

spec:
  replicas: 1

  selector:
    matchLabels:
      app: trip-service

  template:
    metadata:
      labels:
        app: trip-service

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532

      containers:
        - name: trip-service
          image: localhost:5001/trip-service:lab1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: HTTP_ADDR
              value: ":8080"

            - name: LOG_LEVEL
              value: "info"

            - name: SHUTDOWN_TIMEOUT
              value: "10s"

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trip-service-config
                  key: DATABASE_URL

            - name: DATABASE_MAX_CONNS
              value: "10"

            - name: DATABASE_MIN_CONNS
              value: "2"

            - name: DATABASE_MAX_CONN_LIFETIME
              value: "30m"

            - name: DATABASE_CONNECT_TIMEOUT
              value: "5s"

            - name: DATABASE_QUERY_TIMEOUT
              value: "3s"

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 4

---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: tripgo-lab-01

spec:
  selector:
    app: trip-service

  ports:
    - name: http
      port: 8080
      targetPort: http